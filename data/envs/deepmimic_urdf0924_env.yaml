env_name: "deepmimic"

env:
    char_file: "data/assets/xml0924/urdf0924.xml" #parameters 27
    camera_mode: "track"

    episode_length: 3.0 # seconds
    global_obs: True
    root_height_obs: True
    pose_termination: True
    pose_termination_dist: 1.0 # m
    enable_phase_obs: False
    enable_tar_obs: True
    num_phase_encoding: 4
    tar_obs_steps: [1, 2, 3]
    rand_reset: True
    zero_center_action: True

